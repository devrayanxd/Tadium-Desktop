name: Build Tadium Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip ─────────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install build tools ───────────────────────────────────────────────
      - name: Install Visual C++ build tools
        uses: microsoft/setup-msbuild@v2

      # ── 5. Install Python deps ───────────────────────────────────────────────
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools

          # Install llama-cpp-python with CUDA support if available,
          # fall back to CPU-only build
          $env:CMAKE_ARGS = "-DLLAMA_CUBLAS=ON"
          pip install llama-cpp-python==0.3.4 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu121 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CUDA build failed, falling back to CPU build..."
            pip install llama-cpp-python==0.3.4
          }

          # Install the rest
          pip install pywebview==5.3.4
          pip install pyautogui==0.9.54
          pip install pyperclip==1.9.0
          pip install Pillow==10.4.0
          pip install playwright==1.49.0
          pip install opencv-python==4.10.0.84
          pip install pyinstaller==6.11.1

      # ── 6. Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ── 7. Check assets exist ────────────────────────────────────────────────
      - name: Verify required assets
        shell: pwsh
        run: |
          $required = @("index.html", "main.py", "icon.png", "tadium.png", "light.ttf", "bold.ttf")
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing required file: $f"
              exit 1
            }
          }
          Write-Host "All assets present."

      # ── 8. PyInstaller build ─────────────────────────────────────────────────
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller tadium.spec --noconfirm --clean

      # ── 9. Zip the output ────────────────────────────────────────────────────
      - name: Zip dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Tadium\* -DestinationPath Tadium-Windows.zip

      # ── 10. Upload artifact ──────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tadium-Windows
          path: Tadium-Windows.zip
          retention-days: 30

      # ── 11. Create GitHub Release (on tag push) ──────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tadium-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
