<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tadium</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
@font-face {
  font-family: 'App';
  src: url('./light.ttf') format('truetype');
  font-weight: 300;
}
@font-face {
  font-family: 'App';
  src: url('./bold.ttf') format('truetype');
  font-weight: 700;
}

:root {
  --bg-base:      #111110;
  --bg-weak:      #161514;
  --bg-strong:    #0d0d0c;

  --surface-base:         rgba(255,255,255,0.04);
  --surface-raised:       rgba(255,255,255,0.055);
  --surface-raised-solid: #1c1c1b;
  --surface-inset:        rgba(0,0,0,0.28);
  --surface-float:        #2a2825;

  --surface-interactive:       rgba(99,132,255,0.14);
  --surface-interactive-hover: rgba(99,132,255,0.22);
  --surface-interactive-weak:  rgba(99,132,255,0.07);

  --interactive:       #6384FF;
  --interactive-hover: #7B99FF;

  --text:        #E8E6E3;
  --text-weak:   #9B9891;
  --text-weaker: #6B6863;
  --text-strong: #F5F3F0;

  --ok:   #3BB95F;
  --warn: #D68C27;
  --err:  #DC4A38;

  --border:        rgba(255,255,255,0.08);
  --border-weak:   rgba(255,255,255,0.05);
  --border-strong: rgba(255,255,255,0.13);
  --border-focus:  rgba(99,132,255,0.5);

  --syntax-const: #00C4CC;

  --r-xs: 2px; --r-sm: 4px; --r-md: 6px;
  --r-lg: 8px; --r-xl: 10px;

  --font: 'App', -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-base);
  color: var(--text);
  font-family: var(--font);
  font-weight: 300;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ── LAYOUT ── */
#app {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
}

/* ── HEADER ── */
#header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-weak);
  z-index: 50;
  position: relative;
  -webkit-app-region: drag;
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
  -webkit-app-region: no-drag;
}

.header-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 20px;
  pointer-events: none;
}
.header-center img {
  height: 100%;
  object-fit: contain;
}
.header-center .wordmark-text {
  font-weight: 700;
  letter-spacing: 0.1em;
  font-size: 16px;
  color: var(--text-strong);
}

/* ── ICON BUTTON ── */
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s;
  background: transparent; border: none;
  color: var(--text-weak);
  -webkit-app-region: no-drag;
}
.icon-btn:hover {
  background: var(--surface-base);
  color: var(--text);
}
.icon-btn .material-symbols-outlined { font-size: 20px; }

/* ── SIDEBAR ── */
#sidebar {
  background: var(--bg-strong);
  border-right: 1px solid var(--border-weak);
  display: flex; flex-direction: column;
  overflow: hidden;
  width: 260px;
  transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}
#sidebar.collapsed {
  width: 0;
  border-right: none;
}

/* chats list */
#chats-zone {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; padding: 14px 8px;
}
.chats-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 12px;
}
#chats-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#chats-list::-webkit-scrollbar { width: 3px; }
#chats-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chat-row {
  padding: 10px 12px; border-radius: var(--r-md);
  cursor: pointer; font-size: 13px; color: var(--text-weak);
  transition: all 0.1s; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-row:hover { background: var(--surface-base); color: var(--text); }
.chat-row.active { background: var(--surface-interactive-weak); color: var(--text); }

/* ── MAIN ── */
#main {
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg-base);
  position: relative;
}

/* messages */
#messages {
  flex: 1; overflow-y: auto;
  padding: 40px 20%;
  display: flex; flex-direction: column; gap: 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@media (max-width: 1200px) { #messages { padding: 40px 10%; } }

/* empty state */
#empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; pointer-events: none;
  padding-bottom: 80px;
}
.empty-icon { font-size: 32px; opacity: 0.12; margin-bottom: 6px; }
.empty-h { font-weight: 700; font-size: 15px; color: var(--text-weaker); }
.empty-s { font-size: 12px; color: var(--text-weaker); opacity: 0.65; }

/* message rows */
.msg { display: flex; gap: 16px; animation: rise 0.2s ease-out; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-raised-solid);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 1px solid var(--border);
  overflow: hidden;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-avatar .material-symbols-outlined { font-size: 18px; color: var(--text-weak); }

.msg-avatar.tadium-av {
  background: #1a1a28;
  border-color: rgba(99,132,255,0.2);
}
.tadium-glyph {
  font-size: 13px; font-weight: 700;
  color: var(--interactive); letter-spacing: -0.02em;
}

.msg-content { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
.msg.user .msg-content { align-items: flex-end; }

.msg-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; color: var(--text-weaker);
  padding: 0 2px;
}
.msg-bubble {
  padding: 12px 16px; border-radius: 18px;
  font-size: 14px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
.msg.user .msg-bubble {
  background: var(--surface-raised-solid);
  border: 1px solid var(--border);
  color: var(--text-strong);
  border-bottom-right-radius: 4px;
}
.msg.agent .msg-bubble {
  color: var(--text);
  padding-left: 0;
}

/* thinking indicator */
.thinking {
  display: flex; gap: 16px;
  animation: rise 0.2s ease-out;
}
.thinking .msg-avatar { background: #1a1a28; border-color: rgba(99,132,255,0.2); }
.thinking-inner {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 0;
  color: var(--text-weaker); font-size: 13px;
}
.dots { display: flex; gap: 4px; }
.dots i {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--text-weaker); display: block;
  animation: dot 1.1s infinite; font-style: normal;
}
.dots i:nth-child(2) { animation-delay: 0.18s; }
.dots i:nth-child(3) { animation-delay: 0.36s; }
@keyframes dot { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

/* tool log lines */
.tool-line {
  display: flex; gap: 16px;
  animation: rise 0.15s ease-out;
}
.tool-line-inner {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0; font-size: 11px; color: var(--text-weaker);
}
.tool-pipe {
  width: 1px; height: 14px;
  background: var(--border-strong); flex-shrink: 0;
}
.tool-badge {
  background: var(--surface-inset);
  border: 1px solid var(--border);
  border-radius: var(--r-xs);
  padding: 1px 6px; font-size: 10px; font-weight: 700;
  letter-spacing: 0.04em; color: var(--syntax-const);
  white-space: nowrap;
}

/* ── PERMISSION OVERLAY ── */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.72); z-index: 999;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
#overlay.show { display: flex; }
#perm-card {
  background: var(--surface-float);
  border: 1px solid var(--border-strong);
  border-radius: 18px; padding: 24px 22px 20px;
  max-width: 380px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  animation: rise 0.18s ease;
}
#perm-icon { font-size: 22px; margin-bottom: 10px; }
#perm-title { font-weight: 700; font-size: 14px; color: var(--warn); margin-bottom: 8px; }
#perm-act {
  display: inline-block;
  background: var(--surface-inset);
  border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 2px 8px;
  font-size: 11px; font-weight: 700; color: var(--syntax-const);
  margin-bottom: 8px;
}
#perm-detail {
  font-size: 11px; color: var(--text-weaker);
  background: var(--surface-inset);
  border: 1px solid var(--border-weak);
  border-radius: var(--r-md); padding: 8px 11px;
  font-family: monospace; word-break: break-all;
  line-height: 1.5; margin-bottom: 16px;
}
#perm-btns { display: flex; gap: 8px; }
.pb {
  flex: 1; padding: 8px 0; border-radius: 100px;
  border: 1px solid var(--border);
  font-family: var(--font); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.14s; letter-spacing: 0.02em;
}
.pb.allow { background: rgba(59,185,95,0.12); color: var(--ok); border-color: rgba(59,185,95,0.22); }
.pb.allow:hover { background: rgba(59,185,95,0.22); }
.pb.deny  { background: rgba(220,74,56,0.12); color: var(--err); border-color: rgba(220,74,56,0.22); }
.pb.deny:hover  { background: rgba(220,74,56,0.22); }

/* ── INPUT AREA ── */
#input-wrapper {
  padding: 0 20% 32px;
}
@media (max-width: 1200px) { #input-wrapper { padding: 0 10% 24px; } }

#input-container {
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-radius: 32px;
  padding: 4px 12px;
  display: flex; align-items: center;
  backdrop-filter: blur(10px);
  transition: border-color 0.15s;
}
#input-container:focus-within {
  border-color: rgba(99,132,255,0.35);
}

#msg-in {
  background: transparent; border: none;
  outline: none; resize: none;
  color: var(--text); font-family: var(--font);
  font-weight: 300; font-size: 15px;
  line-height: 1.5; width: 100%;
  max-height: 200px;
  caret-color: var(--interactive);
}
#msg-in::placeholder { color: var(--text-weaker); }

.disclaimer {
  text-align: center; margin-top: 10px;
  font-size: 11px; color: var(--text-weaker);
  opacity: 0.6; letter-spacing: 0.03em;
}

/* Model selector button in input bar */
.model-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 10px 5px 10px; border-radius: 100px;
  background: var(--surface-base);
  border: 1px solid var(--border); cursor: pointer;
  font-size: 12px; color: var(--text-weak);
  font-family: var(--font); font-weight: 300;
  transition: all 0.15s; white-space: nowrap;
}
.model-btn:hover { background: var(--surface-raised); color: var(--text); }
.model-btn .material-symbols-outlined { font-size: 16px; }

@keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header id="header">
    <div class="header-left">
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>

    <div class="header-center">
      <img src="assets/tadium.png" alt="Tadium"
           onerror="this.outerHTML='&lt;span class=wordmark-text&gt;TADIUM&lt;/span&gt;'"/>
    </div>

    <div class="header-right"></div>
  </header>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <!-- Chats -->
    <div id="chats-zone">
      <div class="chats-head">
        <span class="z-label" style="margin:0">Recent</span>
        <button class="icon-btn" onclick="newChat()" title="New chat" style="width:28px;height:28px">
          <span class="material-symbols-outlined" style="font-size:18px">add</span>
        </button>
      </div>
      <div id="chats-list"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="messages">
      <div id="empty">
        <div class="empty-icon">◈</div>
        <div class="empty-h">Tadium</div>
        <div class="empty-s">Load a model and start a session</div>
      </div>
    </div>

    <!-- FLOATING INPUT -->
    <div id="input-wrapper">
      <div id="input-container">
        <div class="flex items-center gap-3 w-full py-2">

          <!-- Left actions -->
          <div class="flex items-center gap-1 flex-shrink-0">
            <button class="icon-btn" title="Attach file">
              <span class="material-symbols-outlined">attach_file</span>
            </button>
          </div>

          <!-- Textarea -->
          <textarea id="msg-in" rows="1"
            placeholder="What would you like to change or create?"
            onkeydown="onKey(event)"
            oninput="grow(this)"></textarea>

          <!-- Right actions -->
          <div class="flex items-center gap-2 flex-shrink-0">
            <!-- Model selector - shows detected model name -->
            <button class="model-btn" id="model-input-btn">
              <span id="model-btn-label">Scanning…</span>
              <span class="material-symbols-outlined">expand_more</span>
            </button>

            <!-- Send button -->
            <button
              style="width:40px;height:40px;border-radius:50%;background:var(--surface-raised-solid);
                     display:flex;align-items:center;justify-content:center;color:var(--text-weak);
                     border:1px solid var(--border);cursor:pointer;transition:all 0.18s;flex-shrink:0;"
              onmouseover="this.style.background='var(--surface-float)';this.style.color='var(--text)'"
              onmouseout="this.style.background='var(--surface-raised-solid)';this.style.color='var(--text-weak)'"
              onclick="send()" title="Send">
              <span class="material-symbols-outlined" style="font-size:20px">arrow_upward</span>
            </button>
          </div>

        </div>
      </div>
      <div class="disclaimer">Tadium can make mistakes. Always review sensitive tasks.</div>
    </div>
  </main>
</div>

<!-- PERMISSION OVERLAY -->
<div id="overlay">
  <div id="perm-card">
    <div id="perm-icon">⚠</div>
    <div id="perm-title">Permission Required</div>
    <div id="perm-act"></div>
    <div id="perm-detail"></div>
    <div id="perm-btns">
      <button class="pb allow" onclick="resolvePerm(true)">Allow</button>
      <button class="pb deny"  onclick="resolvePerm(false)">Deny</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────
let chatId   = null
let busy     = false
let sidebarCollapsed = false
let _permRes = null

// ── INIT ───────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  await refreshModels()
  await refreshChats()
})

// ── SIDEBAR ────────────────────────────────────────────────────
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed)
}

// ── MODEL ──────────────────────────────────────────────────────
async function refreshModels() {
  const models = await pywebview.api.scan_models()
  if (!models.length) {
    document.getElementById('model-btn-label').textContent = 'No model'
    return
  }
  // Auto-load the first model found
  const first = models[0]
  document.getElementById('model-btn-label').textContent =
    first.name.length > 16 ? first.name.slice(0, 16) + '…' : first.name
  await pywebview.api.load_model(first.path)
}

// ── CHATS ──────────────────────────────────────────────────────
async function refreshChats() {
  const list = await pywebview.api.list_chats()
  const el = document.getElementById('chats-list')
  el.innerHTML = ''
  list.forEach(c => {
    const row = document.createElement('div')
    row.className = 'chat-row' + (c.id === chatId ? ' active' : '')
    row.textContent = c.title || 'Untitled'
    row.onclick = () => openChat(c.id)
    el.appendChild(row)
  })
}

async function openChat(id) {
  chatId = id
  const data = await pywebview.api.get_chat(id)
  clearMsgs()
  data.messages.forEach(m => addBubble(m.role, m.content))
  await refreshChats()
}

async function newChat() {
  const r = await pywebview.api.new_chat()
  chatId = r.id
  clearMsgs()
  await refreshChats()
}

// ── MESSAGES ───────────────────────────────────────────────────
function clearMsgs() { document.getElementById('messages').innerHTML = '' }

function rmEmpty() {
  const e = document.getElementById('empty')
  if (e) e.remove()
}

function userAvatar() {
  return `<div class="msg-avatar">
    <span class="material-symbols-outlined">person</span>
  </div>`
}

function agentAvatar() {
  return `<div class="msg-avatar tadium-av">
    <span class="tadium-glyph">T</span>
  </div>`
}

function addBubble(role, text) {
  rmEmpty()
  const wrap = document.getElementById('messages')
  const row  = document.createElement('div')
  row.className = 'msg ' + role
  const av   = role === 'user' ? userAvatar() : agentAvatar()
  const label = role === 'user' ? 'You' : 'Tadium'
  const content = document.createElement('div')
  content.innerHTML = `
    <div class="msg-label">${label}</div>
    <div class="msg-bubble"></div>`
  content.className = 'msg-content'
  content.querySelector('.msg-bubble').textContent = text
  row.innerHTML = av
  row.appendChild(content)
  wrap.appendChild(row)
  wrap.scrollTop = wrap.scrollHeight
}

function addThinking() {
  rmEmpty()
  const wrap = document.getElementById('messages')
  const row  = document.createElement('div')
  row.className = 'thinking'; row.id = 'thinking'
  row.innerHTML = `
    ${agentAvatar()}
    <div class="thinking-inner">
      <div class="dots"><i></i><i></i><i></i></div>
      <span>Thinking…</span>
    </div>`
  wrap.appendChild(row)
  wrap.scrollTop = wrap.scrollHeight
}

function rmThinking() {
  const t = document.getElementById('thinking')
  if (t) t.remove()
}

function addToolLine(action, detail) {
  const wrap = document.getElementById('messages')
  const row  = document.createElement('div')
  row.className = 'tool-line'
  row.innerHTML = `
    <div style="width:32px;flex-shrink:0"></div>
    <div class="tool-line-inner">
      <div class="tool-pipe"></div>
      <span class="tool-badge">${esc(action)}</span>
      <span style="color:var(--text-weaker)">${esc(detail)}</span>
    </div>`
  wrap.appendChild(row)
  wrap.scrollTop = wrap.scrollHeight
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

// ── SEND ───────────────────────────────────────────────────────
async function send() {
  const inp  = document.getElementById('msg-in')
  const text = inp.value.trim()
  if (!text || busy) return

  if (!chatId) {
    const r = await pywebview.api.new_chat()
    chatId = r.id
    await refreshChats()
  }

  inp.value = ''; inp.style.height = 'auto'
  busy = true

  addBubble('user', text)
  addThinking()

  try {
    const r = await pywebview.api.send_message({
      chat_id: chatId, message: text, agent_mode: true
    })
    rmThinking()
    if (r.tool_logs) r.tool_logs.forEach(l => addToolLine(l.action, l.detail))
    addBubble('agent', r.reply)
    await refreshChats()
  } catch(e) {
    rmThinking()
    addBubble('agent', '⚠ ' + e.message)
  }

  busy = false
}

// ── PERMISSION ─────────────────────────────────────────────────
async function requestPermission(action, detail) {
  return new Promise(resolve => {
    _permRes = resolve
    document.getElementById('perm-act').textContent    = action
    document.getElementById('perm-detail').textContent = detail
    document.getElementById('overlay').classList.add('show')
  })
}

function resolvePerm(allowed) {
  document.getElementById('overlay').classList.remove('show')
  if (_permRes) { _permRes(allowed); _permRes = null }
  pywebview.api._perm_answer(allowed)
}

// ── UTILS ──────────────────────────────────────────────────────
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
}
function grow(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 200) + 'px'
}
</script>
</body>
</html>
